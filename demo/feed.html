<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #f4f2ee;
    font-family: -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: rgba(0,0,0,.9);
  }
  body { overflow: hidden; } /* scroll is driven via transform on .feed */

  /* ---- top nav ---- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 50;
    background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.04);
    display: flex; align-items: center; gap: 8px; padding: 0 24px;
  }
  .logo { width: 34px; height: 34px; border-radius: 6px; background: #0a66c2;
    color: #fff; font-weight: 800; font-size: 20px; display: grid; place-items: center;
    font-family: Georgia, serif; }
  .search { width: 264px; height: 34px; background: #edf3f8; border-radius: 6px;
    display: flex; align-items: center; padding: 0 10px; gap: 8px; color: #5a6b77; font-size: 14px; }
  .search svg { width: 16px; height: 16px; fill: #5a6b77; }
  .navspacer { flex: 1; }
  .navicons { display: flex; align-items: center; gap: 26px; }
  .navicon { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #66666b; font-size: 11px; }
  .navicon svg { width: 22px; height: 22px; fill: #66666b; }
  .navicon.active { color: rgba(0,0,0,.9); }
  .navicon.active svg { fill: rgba(0,0,0,.9); }
  .navme { width: 24px; height: 24px; border-radius: 50%; background: #c9d1d8; }

  /* ---- feed column ---- */
  .stage { position: fixed; inset: 52px 0 0 0; overflow: hidden; }
  .feed { width: 555px; margin: 0 auto; padding-top: 16px; will-change: transform; }

  .card {
    background: #fff; border-radius: 8px; margin-bottom: 8px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08);
    position: relative; overflow: hidden;
  }
  .card .glow {
    position: absolute; inset: 0; border-radius: 8px; pointer-events: none; opacity: 0;
  }
  .chead { display: flex; align-items: flex-start; padding: 12px 16px 0 16px; gap: 8px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; flex: none;
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; }
  .who { flex: 1; min-width: 0; padding-top: 1px; }
  .nmeta { display: flex; align-items: center; gap: 4px; }
  .name { font-size: 14px; font-weight: 600; color: rgba(0,0,0,.9); line-height: 18px; }
  .verif { width: 14px; height: 14px; }
  .deg { font-size: 13px; color: rgba(0,0,0,.45); font-weight: 400; }
  .headline { font-size: 12px; color: rgba(0,0,0,.6); line-height: 15px; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-size: 12px; color: rgba(0,0,0,.6); display: flex; align-items: center; gap: 3px; margin-top: 1px; }
  .time svg { width: 12px; height: 12px; fill: rgba(0,0,0,.6); }
  .dots { color: rgba(0,0,0,.6); font-size: 20px; line-height: 12px; padding: 0 4px; }
  .promoted { font-size: 12px; color: rgba(0,0,0,.6); }

  .body { padding: 8px 16px 0 16px; }
  .original { font-size: 14px; line-height: 20px; color: rgba(0,0,0,.9); overflow: hidden; }
  .original a { color: #0a66c2; font-weight: 600; }
  .more { color: rgba(0,0,0,.6); }

  .summary { overflow: hidden; }
  .sumtext { font-size: 14px; line-height: 20px; color: rgba(0,0,0,.9); white-space: pre-line; }
  .sumtext.poem { font-style: italic; }

  /* badges — same values the extension ships in styles.css */
  .pillrow { display: flex; align-items: center; margin-top: 6px; }
  .pill { display: inline-block; padding: 2px 8px; font-size: 12px; font-weight: 600;
    border-radius: 12px; color: #0a66c2; background: rgba(10,102,194,.08); }
  .pill.warm { color: #b26a05; background: rgba(239,159,39,.14); }
  .pill.hot  { color: #c93a38; background: rgba(226,75,74,.12); }
  .pill.clean{ color: #1f8a45; background: rgba(31,138,69,.1); }
  .pill.ad   { font-variant-numeric: tabular-nums; }
  .haiku { margin-left: 8px; padding: 2px 6px; font-size: 11px; font-weight: 500;
    color: #949494; border-radius: 10px; opacity: 0; }
  .haiku.hot { background: rgba(128,128,128,.12); }

  .media { margin-top: 12px; height: 260px; background-size: cover; background-position: center; }

  .counts { display: flex; align-items: center; gap: 6px; padding: 8px 16px 6px;
    font-size: 12px; color: rgba(0,0,0,.6); }
  .reacts { display: flex; }
  .reacts span { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center;
    margin-left: -4px; font-size: 11px; border: 1.5px solid #fff; }
  .reacts span:first-child { margin-left: 0; }
  .cdivider { height: 1px; background: rgba(0,0,0,.08); margin: 0 16px; }
  .actions { display: flex; padding: 4px 8px 6px; }
  .act { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 4px; color: rgba(0,0,0,.6); font-size: 14px; font-weight: 600; border-radius: 4px; }
  .act svg { width: 20px; height: 20px; fill: rgba(0,0,0,.6); }

  /* ---- composer (scene 3) ---- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; z-index: 80; }
  .composer { position: fixed; z-index: 90; left: 50%; top: 64px; width: 620px;
    transform: translateX(-50%) scale(.98); opacity: 0;
    background: #fff; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.3); overflow: hidden; }
  .chead2 { display: flex; align-items: center; gap: 10px; padding: 16px 20px 8px; }
  .chead2 .avatar { width: 48px; height: 48px; font-size: 17px; }
  .cname { font-size: 16px; font-weight: 600; }
  .cwho { font-size: 13px; color: rgba(0,0,0,.6); }
  .draft { padding: 6px 20px 0; font-size: 16px; line-height: 24px; min-height: 84px; }
  .caret { display: inline-block; width: 1.5px; height: 18px; background: #0a66c2;
    vertical-align: -3px; margin-left: 1px; }
  .dfc { padding: 4px 20px 0; }
  .dfcbtn { display: inline-block; padding: 3px 11px; font-size: 12px; font-weight: 600;
    border-radius: 12px; color: #0a66c2; background: rgba(10,102,194,.08); }
  .dfcout { margin-top: 8px; opacity: 0; }
  .dfccap { font-size: 12px; color: #808080; }
  .dfccard { margin-top: 5px; padding: 10px 12px; border: 1px solid rgba(128,128,128,.3); border-radius: 10px; }
  .dfchead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dfcava { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 13px; background: #1d4e78; }
  .dfcname { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .dfcmeta { font-size: 11px; color: #808080; }
  .dfcline { font-size: 14px; line-height: 1.45; margin: 0 0 6px; }
  .cfoot { display: flex; align-items: center; gap: 18px; padding: 14px 20px 16px; margin-top: 8px; }
  .cfoot .chip { font-size: 14px; font-weight: 600; color: rgba(0,0,0,.6); }
  .cpost { margin-left: auto; padding: 6px 16px; border-radius: 16px; background: #0a66c2;
    color: #fff; font-size: 15px; font-weight: 600; }

  /* ---- fake cursor ---- */
  .cursor { position: fixed; z-index: 200; width: 22px; height: 22px; opacity: 0;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); pointer-events: none; }
  .ring { position: fixed; z-index: 199; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(10,102,194,.7); opacity: 0; pointer-events: none; }
</style>
</head>

<script>
const POSTS = [
  {
    name:"Marcus Reyes", color:"#3b6ea5", initials:"MR", verified:true, deg:"1st",
    headline:"Chief of Staff | Columbia Business School MBA | Ex-Naval Officer", time:"1w",
    original:`Excited to share that I'm joining <a>Venn</a> as Chief of Staff! 🎉 Venn is building agentic AI for multifamily real estate — a space that is massively underserved by modern software. After months of conversations, I knew this was the team I wanted to bet on. Endless gratitude to everyone who supported me on this journey. More to come 🙏<span class="more"> …more</span>`,

    pill:"defluffed 84% · show fluff", tier:"",
    react:[["#0a66c2","👍"],["#e0457b","❤️"],["#f5bb5c","👏"]], reactN:"370", comments:"73 comments"
  },
  {
    name:"Northwind Cloud", color:"#0a66c2", initials:"NC", verified:true, deg:"", promoted:true,
    headline:"Enterprise infrastructure, reimagined for the AI era", time:"",
    original:`Your data stack wasn't built for agents. Northwind unifies governance, lineage, and observability in one control plane — so your teams ship AI features without waiting on six approvals. See why 4,000+ engineering orgs made the switch this year.<span class="more"> …more</span>`,
    // Seed a full-width spinner frame so the collapsed height is measured with
    // the label present — an empty pill measures short and clips the spinner.
    summary:"", pill:"⠋ ad · Monetizing…", tier:"ad", ad:true,
    react:[["#0a66c2","👍"]], reactN:"128", comments:"12 comments",
    media:"linear-gradient(135deg,#0b2b4a,#0a66c2 65%,#5aa9e6)"
  },
  {
    name:"Meghana Dhar", color:"#7a3b9e", initials:"MD", verified:false, deg:"2nd",
    headline:"Ex-Meta, Ex-Snap | Advisor | Keynote Speaker on AI", time:"3d",
    original:`Three days. 200 conversations. Countless insights. The AI Summit was nothing short of transformational. Huge thanks to <a>Sarah</a>, <a>Miguel</a>, <a>Priya</a> and the brilliant minds who shared the stage — you know who you are. Still processing everything I learned. More reflections coming this week 🙏<span class="more"> …more</span>`,
    summary:"Meghana attended the AI Summit. Plus a lot of name-dropping.",
    pill:"defluffed 91% · show fluff", tier:"warm",
    react:[["#0a66c2","👍"],["#f5bb5c","👏"]], reactN:"1,240", comments:"96 comments"
  },
  {
    name:"Brianna E. Gurrell", color:"#1d6f8b", initials:"BG", verified:true, deg:"1st",
    headline:"Founder & CEO | Forbes 30 Under 30 | Building the future of X", time:"1w",
    original:`A janitor once told me something I'll never forget. "Son," he said, "success isn't about talent. It's about who shows up when nobody's watching." I think about that every single day. We spend so long chasing the big moment that we forget the small ones built it. Agree? ♻️ Repost to inspire someone today.<span class="more"> …more</span>`,
    summary:"Success is about showing up — that's the whole message. Classic engagement bait.",
    haiku:"A janitor spoke.\nNothing you can verify.\nRepost to inspire.",
    pill:"defluffed 96% · see for yourself · really?", tier:"hot",
    react:[["#e0457b","❤️"],["#0a66c2","👍"],["#f5bb5c","👏"]], reactN:"3,412", comments:"210 comments"
  },
  {
    name:"Adam Fielding", color:"#c0563f", initials:"AF", verified:false, deg:"2nd",
    headline:"Product @ Stealth | Endurance athlete | Writing about tools", time:"5d",
    original:`We're hiring two senior backend engineers in Berlin. Rust, Postgres, no on-call. DM me.`,
    summary:"", pill:"fluff not found", tier:"clean", clean:true,
    react:[["#0a66c2","👍"],["#e0457b","❤️"]], reactN:"89", comments:"34 comments"
  },
  {
    // Tail post: the camera never travels to it, it just keeps the viewport
    // full once the scroll settles on the post above.
    name:"Priya Raghavan", color:"#4a6b8a", initials:"PR", verified:true, deg:"2nd",
    headline:"Engineering Manager @ Datadog | Previously Stripe", time:"6d",
    original:`Six months ago our deploy pipeline took 41 minutes and everyone dreaded Fridays. Today it takes 6. No new tooling, no rewrite, no heroics — just three boring decisions we should have made two years earlier. Sharing the full breakdown because I wish someone had shared theirs with us 👇<span class="more"> …more</span>`,
    summary:"Priya's team cut deploys from 41 minutes to 6, with no new tooling.",
    pill:"defluffed 79% · show fluff", tier:"",
    react:[["#0a66c2","👍"],["#f5bb5c","👏"]], reactN:"642", comments:"57 comments"
  }
];

const DRAFT = "I don't usually share personal wins, but after a long journey of self-doubt, late nights, and more coffee than I'd like to admit, I finally cracked a problem I'd been circling for years: 1+1. The answer — and I'm still processing this — is 2.";

const SPIN = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
const VERBS = ["Monetizing","Upselling","Sponsoring","Synergizing","Retargeting","Converting"];

const VERIF = `<svg class="verif" viewBox="0 0 24 24"><path fill="#f5bb5c" d="M12 2l2.4 1.8 3 .1 1 2.8 2.4 1.7-.9 2.9.9 2.9-2.4 1.7-1 2.8-3 .1L12 22l-2.4-1.8-3-.1-1-2.8L3.2 15l.9-2.9-.9-2.9 2.4-1.7 1-2.8 3-.1z"/><path d="M10.6 14.6l-2.2-2.2-1.1 1.1 3.3 3.3 5.5-5.5-1.1-1.1z" fill="#fff"/></svg>`;
const GLOBE = `<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 2c1.5 0 3 2.5 3 6H9c0-3.5 1.5-6 3-6zM4.3 11H7c.1-2 .6-3.8 1.4-5.1A8 8 0 004.3 11zM7 13H4.3a8 8 0 003.1 5.1C6.6 16.8 6.1 15 7 13zm2 0h6c0 3.5-1.5 6-3 6s-3-2.5-3-6zm8 0h2.7a8 8 0 01-3.1 5.1c.8-1.3 1.3-3.1 1.4-5.1zm0-2c-.1-2-.6-3.8-1.4-5.1A8 8 0 0119.7 11H17z"/></svg>`;
const ICONS = {
  like:`<svg viewBox="0 0 24 24"><path d="M9 21H5a1 1 0 01-1-1v-9a1 1 0 011-1h4v11zm2-11l3.5-7c1.3 0 2.5 1.2 2.5 2.5V8h4a2 2 0 012 2l-1.6 8a2 2 0 01-2 1.6H11V10z" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="1.6"/></svg>`,
  comment:`<svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H9l-5 4V5a1 1 0 011-1z" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="1.6"/></svg>`,
  repost:`<svg viewBox="0 0 24 24"><path d="M7 7h9v3l4-4-4-4v3H5v6h2V7zm10 10H8v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>`,
  send:`<svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-7-8-3z" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="1.6"/></svg>`
};

function cardHTML(p){
  const reacts = p.react.map(r=>`<span style="background:${r[0]}">${r[1]}</span>`).join("");
  const media = p.media ? `<div class="media" style="background-image:${p.media}"></div>` : "";
  const meta = p.promoted
    ? `<div class="promoted">Promoted</div>`
    : `<div class="time">${p.time} • ${GLOBE}</div>`;
  const haikuBtn = p.haiku ? `<span class="haiku">haiku</span>` : "";
  return `<div class="card">
    <div class="glow"></div>
    <div class="chead">
      <div class="avatar" style="background:${p.color}">${p.initials}</div>
      <div class="who">
        <div class="nmeta"><span class="name">${p.name}</span>${p.verified?VERIF:""}${p.deg?`<span class="deg">• ${p.deg}</span>`:""}</div>
        <div class="headline">${p.headline}</div>
        ${meta}
      </div>
      <div class="dots">⋯</div>
    </div>
    <div class="body">
      <div class="original">${p.original}</div>
      <div class="summary">
        <div class="sumtext">${p.summary}</div>
        <div class="pillrow"><span class="pill ${p.tier}">${p.pill}</span>${haikuBtn}</div>
      </div>
    </div>
    ${media}
    <div class="counts">
      <div class="reacts">${reacts}</div>
      <span>${p.reactN}</span><span style="margin-left:auto">${p.comments}</span>
    </div>
    <div class="cdivider"></div>
    <div class="actions">
      <div class="act">${ICONS.like} Like</div>
      <div class="act">${ICONS.comment} Comment</div>
      <div class="act">${ICONS.repost} Repost</div>
      <div class="act">${ICONS.send} Send</div>
    </div>
  </div>`;
}

const feed = document.getElementById("feed");
feed.innerHTML = POSTS.map(cardHTML).join("");

// Measure natural heights once, before any collapse is applied.
const cards = [...feed.querySelectorAll(".card")];
const M = cards.map((card,i)=>{
  const orig = card.querySelector(".original");
  const sum = card.querySelector(".summary");
  const sumtext = card.querySelector(".sumtext");
  orig.style.maxHeight="none"; sum.style.maxHeight="none"; sum.style.opacity="1";
  const oH = orig.offsetHeight;
  const sH = sum.offsetHeight;
  // Poem height must be measured in the EXACT final state — italic text and the
  // longer "enough poetry" label both move it. Measuring the text alone leaves
  // the badge row clipped.
  let pH = sH;
  if (POSTS[i].haiku){
    const hEl = card.querySelector(".haiku");
    const keepText = sumtext.textContent, keepBtn = hEl.textContent;
    sumtext.textContent = POSTS[i].haiku;
    sumtext.classList.add("poem");
    hEl.textContent = "enough poetry";
    pH = sum.offsetHeight;
    sumtext.textContent = keepText;
    sumtext.classList.remove("poem");
    hEl.textContent = keepBtn;
  }
  return {card, orig, sum, sumtext, pill:card.querySelector(".pill"),
          haikuEl:card.querySelector(".haiku"), glow:card.querySelector(".glow"), oH, sH, pH};
});

// A "clean" post is never summarized — the original stays, the green badge just
// appears underneath. Collapse is a no-op for it.
const CLEAN = POSTS.map(p=>!!p.clean);

const stage = document.querySelector(".stage");
const scrim = document.getElementById("scrim");
const composer = document.getElementById("composer");
const drafttext = document.getElementById("drafttext");
const caret = document.getElementById("caret");
const dfcbtn = document.getElementById("dfcbtn");
const dfcout = document.getElementById("dfcout");
const cursor = document.getElementById("cursor");
const ring = document.getElementById("ring");

const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const smooth = x => { x = clamp(x,0,1); return x*x*(3-2*x); };
const smoother = x => { x = clamp(x,0,1); return x*x*x*(x*(x*6-15)+10); };

// Scroll travel: trapezoid velocity — brief ease-in, constant speed, gentle
// settle. S-curves (smooth/smoother) creep for the first second, which reads
// as a stalled video; a real scroll gets up to speed and stays there.
function travel(x){
  x = clamp(x,0,1);
  const A = 0.10, B = 0.85;                 // ramp-up ends / ramp-down starts
  const area = A/2 + (B-A) + (1-B)/2;       // normalizer
  let s;
  if (x < A) s = (x*x)/(2*A);
  else if (x < B) s = A/2 + (x-A);
  else { const u = (x-B)/(1-B); s = A/2 + (B-A) + (1-B)*(u - u*u/2); }
  return s/area;
}
// progress of t through [a,b]
const seg = (t,a,b)=> clamp((t-a)/(b-a), 0, 1);

function setCollapse(i, c){
  const m = M[i];
  if (CLEAN[i]){
    // original never hides; the badge fades in on its own
    m.orig.style.maxHeight = "none";
    m.orig.style.opacity = "1";
    m.sum.style.maxHeight = m.sH + "px";
    m.sum.style.opacity = String(smooth((c-0.25)/0.5));
    return;
  }
  const ce = smoother(c);
  m.orig.style.maxHeight = (m.oH*(1-c)) + "px";
  m.orig.style.opacity = String(Math.max(0, 1-ce*1.6));
  m.sum.style.maxHeight = (m.sH*c) + "px";
  m.sum.style.opacity = String(smooth((c-0.30)/0.55));
  const g = c*(1-c)*4; // marking glow peaks mid-transition
  m.card.style.boxShadow =
    `0 0 0 1px rgba(0,0,0,.08), 0 0 0 ${(2*g).toFixed(2)}px rgba(10,102,194,${(0.55*g).toFixed(3)}), `+
    `0 8px 26px rgba(10,102,194,${(0.30*g).toFixed(3)})`;
  m.glow.style.opacity = "1";
  m.glow.style.background = `rgba(10,102,194,${(0.06*g).toFixed(3)})`;
}

// --- timeline ---------------------------------------------------------------
// t is overall progress in [0,1]. Scenes, in order:
//   scroll+defluff → haiku on the PURE post → composer fluff check
const T_SCROLL_A = 0.035; // ≈0.8s dwell on post 0, moving by ~1s
const T_SCROLL_B = 0.50;  // scrolling + collapsing finishes
const T_HAIKU_A  = 0.54;  // cursor moves to the summary
const T_HAIKU_B  = 0.60;  // click
const T_HAIKU_C  = 0.70;  // poem fully unfolded (then holds)
const T_COMP_A   = 0.74;  // composer opens
const T_TYPE_A   = 0.77;
const T_TYPE_B   = 0.88;  // draft typed
const T_CHECK    = 0.91;  // click "check fluff"
const T_RESULT   = 0.95;  // preview card in

const HAIKU_IDX = POSTS.findIndex(p=>p.haiku);
const BAND = 0.62;   // travel that collapses one post
const TAIL = 2.3;    // extra travel: collapses the tail post and settles
const FOCUS = 0.30;  // active post sits at 30% of the viewport
// The camera walks every post EXCEPT the last one — that one exists only to
// fill the space below the final resting position, so the feed never bottoms
// out into empty background.
const N_CAM = POSTS.length - 1;

function place(el, x, y){ el.style.transform = `translate(${x}px, ${y}px)`; }

window.renderFrame = function(frame, total){
  const t = total<=1 ? 0 : frame/(total-1);
  const N = POSTS.length;

  // ---- scroll + collapse ----
  const p = travel(seg(t, T_SCROLL_A, T_SCROLL_B));
  const front = p * (N_CAM - 1 + TAIL);
  for (let i=0;i<N;i++) setCollapse(i, clamp((front - i)/BAND, 0, 1));

  const lo = clamp(Math.floor(front), 0, N_CAM-1);
  const hi = Math.min(N_CAM-1, lo+1);
  const f = clamp(front - lo, 0, 1);
  const anchor = M[lo].card.offsetTop*(1-f) + M[hi].card.offsetTop*f;
  // after the scroll scene, drift back so the PURE post is centred for the haiku
  const haikuPull = smoother(seg(t, T_SCROLL_B, T_HAIKU_A));
  const target = anchor*(1-haikuPull) + M[HAIKU_IDX].card.offsetTop*haikuPull;
  const scroll = Math.max(0, target - FOCUS*stage.clientHeight + 8);
  feed.style.transform = `translateY(${-scroll}px)`;

  // ---- ad spinner (deterministic: derived from frame, never from a clock) ----
  const adIdx = POSTS.findIndex(x=>x.ad);
  if (adIdx >= 0){
    const tick = Math.floor(frame/3);   // ~10 frames/s, close to the app's 80ms
    const verb = VERBS[Math.floor(frame/90) % VERBS.length]; // new verb every ~3s
    M[adIdx].pill.textContent = `${SPIN[tick % SPIN.length]} ad · ${verb}…`;
  }

  // ---- haiku scene ----
  const hm = M[HAIKU_IDX];
  const hb = hm.haikuEl;
  const reveal = seg(t, T_HAIKU_A, T_HAIKU_B);          // button fades in under the cursor
  const clicked = t >= T_HAIKU_B;
  hb.style.opacity = String(clicked ? 0.85 : 0.75*smooth(reveal));
  hb.classList.toggle("hot", clicked);
  if (clicked){
    hb.textContent = "enough poetry";
    hm.sumtext.textContent = POSTS[HAIKU_IDX].haiku;
    hm.sumtext.classList.add("poem");
    // grow the summary box to fit three lines, then release the clamp
    const grow = smoother(seg(t, T_HAIKU_B, T_HAIKU_C));
    hm.sum.style.maxHeight = grow >= 1 ? "none" : (hm.sH + (hm.pH-hm.sH)*grow) + "px";
    hm.sum.style.opacity = "1";
  } else {
    hb.textContent = "haiku";
    hm.sumtext.textContent = POSTS[HAIKU_IDX].summary;
    hm.sumtext.classList.remove("poem");
  }

  // ---- composer scene ----
  const open = smoother(seg(t, T_COMP_A, T_COMP_A+0.03));
  scrim.style.opacity = String(0.55*open);
  composer.style.opacity = String(open);
  composer.style.transform = `translateX(-50%) scale(${(0.98 + 0.02*open).toFixed(3)})`;

  const typed = seg(t, T_TYPE_A, T_TYPE_B);
  const nChars = Math.round(DRAFT.length * smooth(typed));
  drafttext.textContent = open > 0 ? DRAFT.slice(0, nChars) : "";
  caret.style.opacity = (open > 0 && t < T_CHECK && Math.floor(frame/12) % 2 === 0) ? "1" : "0";

  if (t >= T_CHECK && t < T_RESULT) dfcbtn.textContent = "checking…";
  else dfcbtn.textContent = "check fluff";
  dfcbtn.style.opacity = t >= T_RESULT ? "0" : "1";   // hides once it has a verdict
  dfcout.style.opacity = String(smooth(seg(t, T_RESULT, T_RESULT+0.03)));

  // ---- cursor choreography ----
  // waypoints: idle → haiku button → composer button. Positions are computed
  // from live element rects so they stay correct if the layout shifts.
  const hbRect = hb.getBoundingClientRect();
  const btnRect = dfcbtn.getBoundingClientRect();
  let cx = 980, cy = 620, vis = 0, press = 0;
  if (t >= T_SCROLL_B - 0.04 && t < T_COMP_A){
    const approach = smoother(seg(t, T_SCROLL_B-0.04, T_HAIKU_A));
    cx = 980*(1-approach) + (hbRect.left + hbRect.width/2)*approach;
    cy = 620*(1-approach) + (hbRect.top + hbRect.height/2)*approach;
    vis = smooth(seg(t, T_SCROLL_B-0.04, T_SCROLL_B));
    press = seg(t, T_HAIKU_B-0.012, T_HAIKU_B) * (t < T_HAIKU_B+0.02 ? 1 : 0);
  } else if (t >= T_COMP_A){
    const approach = smoother(seg(t, T_TYPE_B, T_CHECK));
    const fromX = 620, fromY = 300;
    cx = fromX*(1-approach) + (btnRect.left + btnRect.width/2)*approach;
    cy = fromY*(1-approach) + (btnRect.top + btnRect.height/2)*approach;
    // leave right after the click so the verdict lands in clean space
    vis = 1 - smooth(seg(t, T_CHECK+0.015, T_CHECK+0.045));
    press = seg(t, T_CHECK-0.012, T_CHECK) * (t < T_CHECK+0.02 ? 1 : 0);
  }
  place(cursor, cx, cy);
  cursor.style.opacity = String(vis);
  // click ripple
  const rs = 0.5 + 0.9*press;
  place(ring, cx - 17, cy - 17);
  ring.style.opacity = String(press > 0 ? (1-press)*0.9 : 0);
  ring.style.width = ring.style.height = (34*rs).toFixed(1) + "px";

  return {t:+t.toFixed(3), front:+front.toFixed(2)};
};

window.renderFrame(0, 100);
window.__ready = true;
</script>
</body>
</html>
